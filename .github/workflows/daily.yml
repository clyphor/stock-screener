name: Daily screener

on:
  schedule:
    # 22:30 UTC Mon-Fri = 9:30am Sydney Tue-Sat (after the US close; ASX closed earlier)
    - cron: "30 22 * * 1-5"
  workflow_dispatch:   # lets you press "Run workflow" from the GitHub app/website

permissions:
  contents: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run screener
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # optional
        run: python run.py
      - name: Save results (small CSVs) to main
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results
          git commit -m "Daily results $(date -u +%F)" || echo "No changes"
          git pull --rebase origin main && git push
      - name: Publish the web page (replaced each day, no history kept)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
