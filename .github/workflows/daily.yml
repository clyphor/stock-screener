name: Daily screener

on:
  schedule:
    # Each market runs after its own close, once every data source has the day (times in UTC):
    - cron: "30 5 * * 2-6"    # US  — 4:30pm Sydney (AEDT) / 1:30am New York, Tue-Sat
    - cron: "15 8 * * 1-5"    # ASX — 7:15pm Sydney (AEDT), ~3h after the close
    - cron: "45 12 * * 1-5"   # PSX — 5:45pm Karachi, ~2h after the close
  workflow_dispatch:   # lets you press "Run workflow" from the GitHub app/website
    inputs:
      markets:
        description: "Markets to run, e.g. US or ASX,PSX (empty = all three)"
        type: string
        default: ""
      staging:
        description: "Test run: publish to /staging/ only, don't touch the live page or saved results"
        type: boolean
        default: false
      staging_ai:
        description: "Test run only: also use Claude AI scoring (costs API credit). Off = free test without AI."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore cached data (headline scores from earlier days, so Claude only reads new headlines)
        if: inputs.staging != true
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: screener-cache-none
          restore-keys: screener-cache-
      - name: Which markets?
        id: which
        run: |
          case "${{ github.event.schedule }}" in
            "30 5 * * 2-6") m=US ;;
            "15 8 * * 1-5") m=ASX ;;
            "45 12 * * 1-5") m=PSX ;;
            *) m="${{ inputs.markets }}" ;;
          esac
          echo "markets=$m" >> "$GITHUB_OUTPUT"; echo "Running: ${m:-all markets}"
      - name: Start from the current page (so the markets not run today are kept)
        if: steps.which.outputs.markets != ''
        run: |
          mkdir -p docs
          git fetch -q --depth 1 origin gh-pages
          git archive origin/gh-pages | tar -x -C docs --exclude=staging
          ls docs | head
      - name: Run screener
        id: screener
        env:
          # optional: either secret name works
          ANTHROPIC_API_KEY: ${{ (inputs.staging != true || inputs.staging_ai == true) && (secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_API_KEY) || '' }}
          # optional, free: second US price source (massive.com) to verify Yahoo's closes
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python run.py --markets "${{ steps.which.outputs.markets }}"
      - name: Publish the web page (replaced each day, no history kept)
        if: steps.screener.outcome == 'success' && inputs.staging != true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
      - name: Cache today's market data for on-demand runs
        if: steps.screener.outcome == 'success' && inputs.staging != true
        uses: actions/cache/save@v4
        with:
          path: cache
          key: screener-cache-${{ github.run_id }}
      - name: Publish a TEST page to /staging/ (live page untouched)
        if: steps.screener.outcome == 'success' && inputs.staging == true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          destination_dir: staging
          keep_files: true
      - name: Save results and run log to main (also when the screener failed, never when cancelled)
        if: always() && inputs.staging != true && (steps.screener.outcome == 'success' || steps.screener.outcome == 'failure')
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@users.noreply.github.com"
          cp -r results /tmp/results_new
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main          # start from the latest code
            rm -rf results && cp -r /tmp/results_new results   # this run's results win
            git add -A results
            git commit -qm "Daily results $(date -u +%F) ${{ steps.which.outputs.markets || 'all' }}" || { echo "No changes"; exit 0; }
            git push -q origin HEAD:main && exit 0
            echo "push raced with another change, retrying ($i)"; sleep 5
          done
          exit 1
