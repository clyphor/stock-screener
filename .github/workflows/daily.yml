name: Daily screener

on:
  schedule:
    # 22:30 UTC Mon-Fri = 9:30am Sydney Tue-Sat (after the US close; ASX closed earlier)
    - cron: "30 22 * * 1-5"
  workflow_dispatch:   # lets you press "Run workflow" from the GitHub app/website

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run screener
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # optional
        run: python run.py
      - name: Save results
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results docs
          git commit -m "Daily results $(date -u +%F)" || echo "No changes"
          git push
