name: Daily screener

on:
  # Runs are started on time by the Supabase scheduler (db/schema.sql), at each market's own time —
  # GitHub's own schedules were often hours late.
  workflow_dispatch:   # lets you press "Run workflow" from the GitHub app/website
    inputs:
      markets:
        description: "Markets to run, e.g. US or ASX,PSX or COM,CRYPTO (empty = all five)"
        type: string
        default: ""
      staging:
        description: "Test run: publish to /staging/ only, don't touch the live page or saved results"
        type: boolean
        default: false
      ai_only:
        description: "Test run only: use just this AI provider (Claude, Gemini, GitHub, Groq). Empty = normal order."
        type: string
        default: ""
      staging_ai:
        description: "Test run only: also use AI scoring (Claude costs credit; the free providers don't). Off = test without AI."
        type: boolean
        default: false

permissions:
  contents: write
  models: read      # free AI through GitHub Models (used when Claude has no credit)

concurrency:
  group: screener
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"   # print progress as it happens, so a stuck run shows where it stopped

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore cached data (headline scores from earlier days, so Claude only reads new headlines)
        if: inputs.staging != true
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: screener-cache-none
          restore-keys: screener-cache-
      - name: Which markets?
        id: which
        run: |
          case "${{ github.event.schedule }}" in
            "30 5 * * 2-6") m=US ;;
            "15 8 * * 1-5") m=ASX ;;
            "45 12 * * 1-5") m=PSX ;;
            "15 23 * * 1-5") m=COM ;;
            "40 0 * * *") m=CRYPTO ;;
            *) m="${{ inputs.markets }}" ;;
          esac
          echo "markets=$m" >> "$GITHUB_OUTPUT"; echo "Running: ${m:-all markets}"
      - name: Start from the current page (so the markets not run today are kept)
        if: steps.which.outputs.markets != ''
        run: |
          mkdir -p docs
          git fetch -q --depth 1 origin gh-pages
          git archive origin/gh-pages | tar -x -C docs --exclude=staging
          ls docs | head
      - name: Run screener
        id: screener
        env:
          # optional: either secret name works
          ANTHROPIC_API_KEY: ${{ (inputs.staging != true || inputs.staging_ai == true) && (secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_API_KEY) || '' }}
          # free AI fall-backs, tried in this order after Claude (see claude_api.py)
          GEMINI_API_KEY: ${{ (inputs.staging != true || inputs.staging_ai == true) && secrets.GEMINI_API_KEY || '' }}
          GITHUB_TOKEN: ${{ (inputs.staging != true || inputs.staging_ai == true) && secrets.GITHUB_TOKEN || '' }}
          GROQ_API_KEY: ${{ (inputs.staging != true || inputs.staging_ai == true) && secrets.GROQ_API_KEY || '' }}
          AI_ONLY: ${{ inputs.staging == true && inputs.ai_only || '' }}
          # optional free data: analyst trends + backup news (Finnhub), DCF value + rating (Financial Modeling Prep)
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          # members-only analysis: full results go to the database, the public page shows scores only
          SUPABASE_SERVICE_KEY: ${{ inputs.staging != true && secrets.SUPABASE_SERVICE_KEY || '' }}
          # optional, free: second US price source (massive.com) to verify Yahoo's closes
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python run.py --markets "${{ steps.which.outputs.markets }}"
      - name: Publish the web page (replaced each day, no history kept)
        if: steps.screener.outcome == 'success' && inputs.staging != true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
      - name: Cache today's market data for on-demand runs
        if: steps.screener.outcome == 'success' && inputs.staging != true
        uses: actions/cache/save@v4
        with:
          path: cache
          key: screener-cache-${{ github.run_id }}
      - name: Publish a TEST page to /staging/ (live page untouched)
        if: steps.screener.outcome == 'success' && inputs.staging == true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          destination_dir: staging
          keep_files: true
      - name: Save results and run log to main (also when the screener failed, never when cancelled)
        if: always() && inputs.staging != true && (steps.screener.outcome == 'success' || steps.screener.outcome == 'failure')
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@users.noreply.github.com"
          cp -r results /tmp/results_new
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main          # start from the latest code
            rm -rf results && cp -r /tmp/results_new results   # this run's results win
            git add -A results
            git commit -qm "Daily results $(date -u +%F) ${{ steps.which.outputs.markets || 'all' }}" || { echo "No changes"; exit 0; }
            git push -q origin HEAD:main && exit 0
            echo "push raced with another change, retrying ($i)"; sleep 5
          done
          exit 1
