name: Probe data sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: python tools/probe_psx.py
      - name: Save result to the 'probe' branch
        run: |
          git config user.name "screener-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout --orphan probe && git rm -rfq --cached . && git add probe.json
          git commit -qm "probe" && git push -f origin probe
